
[project]
name = "triply-a-multi-agent-travel-planner-with-langgraph"
version = "0.1.0"
description = "A multi-agent travel planner built with LangGraph"
readme = "README.md"
authors = [
    { name = "Rifat211-debug", email = "salauddin.alrifat@gmail.com" }
]
requires-python = ">=3.12,<3.13"

dependencies = [
    "langgraph==1.2.2",
    "langchain==1.3.2",
    "langchain-groq==1.1.3",
    "langchain-community==0.4.2",
    "langchain-tavily==0.2.18",
    "psycopg[binary]==3.3.4",
    "psycopg-pool==3.3.1",
    "python-dotenv==1.2.2",
    "tavily-python==0.7.24",
    "requests==2.34.2",
    "langgraph-checkpoint-postgres==3.1.0",
    "airportsdata==20260315",
    "pycountry==26.2.16",
    "fastapi==0.136.3",
    "uvicorn==0.48.0",
    "jinja2==3.1.6",
]

[project.scripts]
triply-a-multi-agent-travel-planner-with-langgraph = "triply_a_multi_agent_travel_planner_with_langgraph:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
